spring:
  application:
    name: impacto-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/impacto}
    username: ${DB_USERNAME:impacto}
    password: ${DB_PASSWORD:impacto}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080
  forward-headers-strategy: framework
security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-random-value-at-least-32-characters-long}
    expiration-seconds: ${JWT_EXPIRATION:3600}
app:
  cors:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
storage:
  path: ${STORAGE_PATH:./storage}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
